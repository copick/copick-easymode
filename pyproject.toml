[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "copick-easymode"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]
dependencies = [
    "click>=8.1.8",
    "copick>=2.0.0a1,<3",
    "numpy>=2.0.2",
    "scipy>=1.10.0",
    "tensorflow>=2.20,<3",
    # easymode itself is installed separately from GitHub with `--no-deps` (see README): it is
    # not on PyPI, and its published metadata wrongly pins numpy<2 / tensorflow<2.12, which
    # conflicts with copick (numpy>=2). easymode runs fine on numpy>=2, so we install copick +
    # numpy>=2 first and declare easymode's runtime deps here so the env is complete.
    "mrcfile",
    "huggingface_hub",
    "requests",
    "tifffile",
    "psutil",
    "starfile",
    "lxml",
    "tqdm",
    "scikit-image",
]
authors = [
    { name = "Utz H. Ermel", email = "utz@ermel.me" },
]
description = "Easymode pretrained segmentation integration for copick CLI."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["cryoet", "cryo-et", "segmentation", "copick", "easymode", "deep-learning"]

[project.urls]
Repository = "https://github.com/copick/copick-easymode.git"
Issues = "https://github.com/copick/copick-easymode/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.2.1",
]
dev = [
    "black>=25.1.0",
    "hatchling>=1.25.0",
    "hatch-vcs>=0.4.0",
    "pre-commit>=4.2.0",
    "ruff>=0.12.0",
]

[project.entry-points."copick.inference.commands"]
easymode = "copick_easymode.cli.inference:easymode"

[tool.hatch.version]
path = "src/copick_easymode/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 120
target_version = ['py311']

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "B",       # bugbear
    "I",       # isort
    "N",       # pep8-naming
    "ASYNC",   # async
    "COM",     # commas
    "C4",      # comprehensions
    "DTZ",     # datetimez
    "ISC",     # implicit-str-concat
    "G",       # logging-format
    "T20",     # print
    "SIM",     # simplify
]
ignore = [
    "G004",   # logging format
    "W293",   # blank line contains whitespace
    "B008",   # Do not perform calls in argument defaults
    "N802",   # Function name should be lowercase
    "N805",   # First argument of a method should be named `self`
    "N806",   # Variable in function should be lowercase
    "N999",   # Invalid module name
    "E501",   # line too long
    "C408",   # rewrite empty built-ins as literals
    "T201",   # print statements.
    "DTZ007", # Datetime objects without timezones.
    "DTZ005", # More datetimes without timezones.
]

[tool.ruff.lint.isort]
known-first-party = ["copick_easymode"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
filterwarnings = [
    'error:get_tomogram is deprecated, use get_tomograms instead.*:DeprecationWarning',
    'error:Input .* contains invalid characters\. It has been sanitized to .*:UserWarning',
]

[tool.coverage.run]
source_pkgs = ["copick_easymode", "tests"]
branch = true

[tool.coverage.paths]
copick_easymode = ["src/copick_easymode", "*/copick-easymode/src/copick_easymode"]
tests = ["tests", "*/copick-easymode/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if TYPE_CHECKING:",
]
